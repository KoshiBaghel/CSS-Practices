<!DOCTYPE html>
<html>
    <head>
        <title>
            Course Cards Layout
        </title>
        <style>
            .frame{
                display: grid;
                justify-content: center;
                gap: 30px;
                text-align: center;
                grid-template-columns: repeat(3, 300px);               
            }
            .Course{
                border: 1px solid black;
                padding: 10px;
                border-radius: 10px;
                margin-top: 20px;
                box-shadow: 2px 2px 8px rgba(15, 10, 157, 0.5);
            }
            h3{
                color: #fd4951;
            }
            img{
                width: 200px;
                height: 200px;
            }
            button:hover{
                cursor: pointer;
                background-color: black;
                color: white;
            }
            .Course:hover{
                border: 3px solid blueviolet;
                padding: 30px;
            }
            h1{
                text-align: center;
                margin-bottom: 20px;
                text-decoration: underline;
                font-family: Verdana;
            }
            
                /* Tablet */
            @media (max-width: 1000px) {
                .frame {
                    grid-template-columns: repeat(2, 300px);
                }
            }

                /* Mobile */
            @media (max-width: 650px) {
                .frame {
                    grid-template-columns: 1fr;
                    width: 80%;
                    margin: auto;
                }

                .Course {
                    width: 100%;
                    box-sizing: border-box;
                }

                img {
                    max-width: 100%;
                    height: auto;
                }
            }

        </style>
    </head>
    <body>
        <h1>Course Section </h1>
        <div class="frame">
            <div class="Course">
                <img src="document/python.png" alt="Python_image">
                <h2>Python Course</h2>
                <h3>$199</h3>
                <button>Add to Cart</button>
            </div>
            <div class="Course">
                <img src="document/java.jpg" alt="Java_image">
                <h2>Java Course</h2>
                <h3>$299</h3>
                <button>Add to Cart</button>
            </div>
            <div class="Course">
                <img src="document/javascript.webp" alt="JavaScript_image">
                <h2>JavaScript Course</h2>
                <h3>$99</h3>
                <button>Add to Cart</button>
            </div>
            <div class="Course">
                <img src="document/web_design.webp" alt="Web design_image">
                <h2>Web Designing Course</h2>
                <h3>$99</h3>
                <button>Add to Cart</button>
            </div>
            <div class="Course">
                <img src="document/digital.webp" alt="Digital Marketing_image">
                <h2>Digital Marketing Course</h2>
                <h3>$159</h3>
                <button>Add to Cart</button>
            </div>
            <div class="Course">
                <img src="document/web.jpg" alt="Web_image">
                <h2>Web Development Course</h2>
                <h3>$249</h3>
                <button>Add to Cart</button>
            </div>

        </div>
    </body>
</html>
